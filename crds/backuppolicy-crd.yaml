apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuppolicies.ops.example.com
spec:
  group: ops.example.com
  scope: Namespaced
  names:
    plural: backuppolicies
    singular: backuppolicy
    kind: BackupPolicy
    shortNames: [bp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [schedule, target, retention]
              properties:
                schedule:
                  type: string
                target:
                  type: object
                  required: [kind, name]
                  properties:
                    kind:
                      type: string
                      enum: [PersistentVolumeClaim]
                    name:
                      type: string
                      minLength: 1
                retention:
                  type: integer
                  minimum: 1
                suspend:
                  type: boolean
                  default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
